# Conda/micromamba environment for CENOP CI (GitHub Actions).
# Reproduces the local `shiny` scientific stack; compiled/scientific deps + dev tools come
# from conda-forge, the Shiny UI stack comes via pip. The package itself is
# installed editable (`pip install -e . --no-deps`) in the workflow so `cenop` imports.
name: cenop-ci
channels:
  - conda-forge
dependencies:
  - python=3.13
  # Core simulation (compiled / scientific — prefer conda-forge wheels)
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - numba>=0.57.0
  # Spatial data (GDAL/GEOS-backed — conda-forge is the reliable source)
  - rasterio>=1.3.0
  - geopandas>=0.13.0
  - shapely>=2.0.0
  - matplotlib-base>=3.7.0
  # Build toolchain for the Cython tick extension (setup_cython.py)
  - cython>=3.0
  - c-compiler
  - setuptools
  # Test + lint tooling
  - pytest>=7.4.0
  - pytest-asyncio>=0.21.0
  # Lint tools are pinned EXACTLY: new black/ruff releases change formatting and add rules,
  # which would fail the lint gate with no code change. Bump deliberately (re-run
  # `black --check --line-length 100 src tests validation` + `ruff check src tests validation`
  # locally first).
  - black==26.1.0
  - ruff==0.15.21
  - pip
  - pip:
      # Shiny UI stack + remaining pure-Python deps (not all on conda-forge)
      - shiny>=1.9.0
      - uvicorn>=0.50
      # shiny-deckgl>=1.16 (the map widget) is not listed: PyPI carries 1.12.0 only; install it
      # from the `razinka` conda channel. The test suite replaces it with a stand-in (tests/conftest.py).
      - shinyswatch>=0.4.0
      - shinywidgets>=0.2.0
      - htmltools>=0.5.0
      - plotly>=5.15.0
      - pydantic>=2.0.0
      - tqdm>=4.65.0
